<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

</style>

<body>

<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="550"></canvas>

  <div id="ui">
    <div id="score">POÄNG: 0</div>
    <div id="lives">❤️❤️❤️</div>
  </div>

  <div id="question" style="display:none"></div>
  <div id="feedback"></div>

  <div id="overlay">
    <h1>📐 DERIVATA-<br>JÄGAREN</h1>
    <p class="subtitle">— MA3C MATEMATIK —</p>
    <p>Hoppa på RÄTT svar för att få poäng!</p>
    <p>➡ Piltangenter = rörelse &nbsp;|&nbsp; ↑ eller SPACE = hoppa</p>
    <p>✅ Rätt svar = +10 poäng</p>
    <p>❌ Fel svar = −15 poäng &amp; liv</p>
    <p>Ämnen: derivata, integraler, gränsvärden, ln/e</p>
    <button id="startBtn" onclick="startGame()">▶ STARTA SPELET</button>
    <div id="instructions">Kräver tangentbord</div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ─── Audio ───────────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;

function initAudio() {
  if (!audioCtx) audioCtx = new AudioCtx();
}

function playTone(freq, type, duration, vol=0.3) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  o.start(); o.stop(audioCtx.currentTime + duration);
}

function playJump()   { playTone(300,'sine',0.15); playTone(450,'sine',0.1); }
function playCorrect(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,'square',0.12,0.2),i*60)); }
function playWrong()  { [200,150,100].forEach((f,i)=>setTimeout(()=>playTone(f,'sawtooth',0.15,0.25),i*80)); }
function playLand()   { playTone(180,'sine',0.08,0.15); }

// ─── Questions ───────────────────────────────────────────
const questions = [
  // Derivataregler
  { q: "f(x)=x³  →  f'(x)=?",     answer: "3x²",    options: ["3x²","x²","3x","2x³"] },
  { q: "f(x)=5x² →  f'(x)=?",     answer: "10x",    options: ["10x","5x","2x","10x²"] },
  { q: "f(x)=sin(x) → f'(x)=?",   answer: "cos(x)", options: ["cos(x)","-cos(x)","sin(x)","-sin(x)"] },
  { q: "f(x)=cos(x) → f'(x)=?",   answer: "-sin(x)",options: ["-sin(x)","sin(x)","cos(x)","-cos(x)"] },
  { q: "f(x)=eˣ  →  f'(x)=?",     answer: "eˣ",     options: ["eˣ","xeˣ","eˣ⁻¹","1"] },
  { q: "f(x)=ln(x) → f'(x)=?",    answer: "1/x",    options: ["1/x","ln(x)","x","1/x²"] },
  { q: "f(x)=7    →  f'(x)=?",    answer: "0",      options: ["0","7","1","7x"] },
  { q: "f(x)=x    →  f'(x)=?",    answer: "1",      options: ["1","0","x","2x"] },
  // Integraler
  { q: "∫ 2x dx = ?",              answer: "x²+C",   options: ["x²+C","2x²+C","x+C","2+C"] },
  { q: "∫ 3 dx = ?",               answer: "3x+C",   options: ["3x+C","3+C","x+C","0"] },
  { q: "∫ cos(x) dx = ?",          answer: "sin(x)+C",options: ["sin(x)+C","-sin(x)+C","cos(x)+C","-cos(x)+C"] },
  { q: "∫ sin(x) dx = ?",          answer: "-cos(x)+C",options: ["-cos(x)+C","cos(x)+C","sin(x)+C","-sin(x)+C"] },
  { q: "∫ eˣ dx = ?",              answer: "eˣ+C",   options: ["eˣ+C","xeˣ+C","eˣ⁻¹+C","1+C"] },
  { q: "∫ 1/x dx = ?",             answer: "ln|x|+C",options: ["ln|x|+C","1/x²+C","x⁻²+C","ln(x²)+C"] },
  // Gränsvärden
  { q: "lim x→0 (sin x)/x = ?",   answer: "1",      options: ["1","0","∞","−1"] },
  { q: "lim x→∞ 1/x = ?",         answer: "0",      options: ["0","1","∞","−1"] },
  { q: "lim x→0 (1+x)^(1/x)=?",  answer: "e",      options: ["e","1","0","∞"] },
  // ln och e
  { q: "ln(e³) = ?",               answer: "3",      options: ["3","e³","3e","1/3"] },
  { q: "e^(ln 5) = ?",             answer: "5",      options: ["5","ln5","e⁵","1"] },
  { q: "ln(1) = ?",                answer: "0",      options: ["0","1","e","−1"] },
  // Kedjeregeln
  { q: "f(x)=sin(2x) → f'(x)=?",  answer: "2cos(2x)",options: ["2cos(2x)","cos(2x)","-2sin(2x)","2sin(2x)"] },
  { q: "f(x)=(x²+1)³ → f'(x)=?", answer: "6x(x²+1)²",options:["6x(x²+1)²","3(x²+1)²","6x²(x²+1)","2x·3(x²+1)"] },
];

// ─── State ───────────────────────────────────────────────
let player, enemies, particles, score, lives, currentQ, gameRunning, bgOffset, frameCount;

function shuffleArray(arr) {
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function startGame() {
  initAudio();
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('question').style.display = 'block';

  score = 0; lives = 3; bgOffset = 0; frameCount = 0; gameRunning = true;
  player = { x:80, y:380, vx:0, vy:0, w:36, h:48, onGround:false, dir:1, frame:0, animT:0 };
  enemies = []; particles = [];
  pickQuestion();
  updateUI();
  requestAnimationFrame(loop);
}

function pickQuestion() {
  const q = questions[Math.floor(Math.random()*questions.length)];
  currentQ = { ...q, opts: shuffleArray([...q.options]) };
  document.getElementById('question').textContent = currentQ.q;
  spawnEnemies();
}

function spawnEnemies() {
  enemies = [];
  const opts = currentQ.opts;
  opts.forEach((opt, i) => {
    enemies.push({
      x: 600 + i * 170,
      y: 350,
      w: 70, h: 60,
      label: opt,
      correct: opt === currentQ.answer,
      vx: -(1.4 + Math.random()*0.6),
      alive: true, deathTimer: 0,
      bob: Math.random()*Math.PI*2
    });
  });
}

// ─── Input ───────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  if (!keys[e.code]) {
    keys[e.code] = true;
    if ((e.code==='ArrowUp'||e.code==='Space') && player.onGround && gameRunning) {
      player.vy = -14; player.onGround = false; playJump();
    }
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

// ─── Platforms ───────────────────────────────────────────
const GROUND_Y = 430;
const platforms = [
  { x:0, y:GROUND_Y, w:W, h:10 },
  { x:200, y:330, w:130, h:12 },
  { x:450, y:270, w:130, h:12 },
  { x:700, y:320, w:120, h:12 },
];

// ─── Update ──────────────────────────────────────────────
function update() {
  frameCount++;
  bgOffset = (bgOffset + 0.5) % W;
  player.animT++;

  // Player movement
  if (keys['ArrowLeft'])  { player.vx = -4; player.dir = -1; }
  else if (keys['ArrowRight']) { player.vx =  4; player.dir =  1; }
  else player.vx *= 0.7;

  player.vy += 0.65; // gravity
  player.x += player.vx;
  player.y += player.vy;
  player.onGround = false;

  // Clamp x
  player.x = Math.max(0, Math.min(W - player.w, player.x));

  // Platform collision
  for (const p of platforms) {
    if (player.x + player.w > p.x && player.x < p.x + p.w &&
        player.y + player.h > p.y && player.y + player.h < p.y + p.h + 16 &&
        player.vy >= 0) {
      player.y = p.y - player.h;
      if (player.vy > 2) playLand();
      player.vy = 0;
      player.onGround = true;
    }
  }

  // Enemy update
  for (const en of enemies) {
    if (!en.alive) { en.deathTimer++; continue; }
    en.x += en.vx;
    en.bob += 0.04;
    const floatY = en.y + Math.sin(en.bob) * 5;

    // Remove off-screen
    if (en.x + en.w < -20) { en.alive = false; en.deathTimer = 99; continue; }

    // Player collision (stomp from above)
    if (player.x + player.w > en.x && player.x < en.x + en.w &&
        player.y + player.h > floatY && player.y + player.h < floatY + en.h + 20 &&
        player.vy > 0) {

      en.alive = false;
      player.vy = -8; // bounce

      if (en.correct) {
        score += 10; playCorrect();
        showFeedback('+10  ✓', '#00ffcc', floatY);
        spawnParticles(en.x + en.w/2, floatY + en.h/2, '#00ffcc', 20);
        setTimeout(pickQuestion, 700);
      } else {
        score -= 15; lives--;
        if (lives < 0) lives = 0;
        playWrong();
        showFeedback('-15  ✗', '#ff4444', floatY);
        spawnParticles(en.x + en.w/2, floatY + en.h/2, '#ff4444', 15);
        if (lives <= 0) { setTimeout(gameOver, 600); }
      }
      updateUI();
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // Check all enemies gone without correct answer → respawn
  const living = enemies.filter(e=>e.alive);
  const deadWithTimer = enemies.filter(e=>!e.alive&&e.deathTimer<60);
  if (living.length === 0 && deadWithTimer.length === 0 && gameRunning) {
    setTimeout(()=>{ if(gameRunning) spawnEnemies(); }, 200);
  }
}

// ─── Feedback ────────────────────────────────────────────
function showFeedback(msg, color, y) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.style.color = color;
  el.style.top = (y - 40) + 'px';
  el.style.opacity = '1';
  el.style.textShadow = `0 0 12px ${color}`;
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0'; }, 1200);
}

function spawnParticles(x, y, color, count) {
  for (let i=0;i<count;i++) {
    particles.push({ x, y,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-1)*7,
      color, life: 40+Math.random()*20,
      r: 2+Math.random()*4
    });
  }
}

function updateUI() {
  document.getElementById('score').textContent = 'POÄNG: ' + score;
  const hearts = ['❤️','🖤','🖤'].map((_,i)=>i<lives?'❤️':'🖤').join('');
  document.getElementById('lives').textContent = hearts;
}

function gameOver() {
  gameRunning = false;
  document.getElementById('question').style.display = 'none';
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1>SPELET SLUT!</h1>
    <p class="subtitle">Slutpoäng: ${score}</p>
    <p>Bra jobbat! Nu kan du Ma3c lite bättre 😄</p>
    <button id="startBtn" onclick="startGame()">▶ SPELA IGEN</button>
  `;
  ov.style.display = 'flex';
  ov.querySelector('button').style.cssText='margin-top:20px;padding:14px 40px;background:transparent;border:2px solid #00ffcc;color:#00ffcc;font-family:"Press Start 2P",monospace;font-size:14px;cursor:pointer;border-radius:4px;';
}

// ─── Draw ─────────────────────────────────────────────────
function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#0a0a2e');
  grad.addColorStop(1,'#1a0a3e');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Stars
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  const stars = [[50,30],[100,80],[200,20],[350,60],[500,15],[650,45],[800,30],[880,70],
                  [130,120],[300,100],[430,90],[700,110],[820,50]];
  stars.forEach(([sx,sy],i)=>{
    const twinkle = 0.5+0.5*Math.sin(frameCount*0.04+i);
    ctx.globalAlpha = twinkle*0.8;
    ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Grid lines (math graph paper feel)
  ctx.strokeStyle = 'rgba(0,255,200,0.05)';
  ctx.lineWidth = 1;
  for(let x=0;x<W;x+=50){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(let y=0;y<H;y+=50){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // Ground
  const gGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  gGrad.addColorStop(0,'#1a3a2a');
  gGrad.addColorStop(1,'#0a1a10');
  ctx.fillStyle = gGrad;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

  ctx.strokeStyle = '#00ffcc';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#00ffcc';
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0,GROUND_Y); ctx.lineTo(W,GROUND_Y); ctx.stroke();
  ctx.shadowBlur = 0;

  // Platforms
  for (const p of platforms) {
    if (p.h < 20) { // floating platforms
      ctx.fillStyle = '#1a4a3a';
      ctx.fillRect(p.x, p.y, p.w, p.h+20);
      ctx.strokeStyle = '#00cc88';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#00cc88'; ctx.shadowBlur = 6;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      ctx.shadowBlur = 0;
    }
  }
}

function drawPlayer() {
  const p = player;
  const cx = p.x + p.w/2;
  const cy = p.y + p.h/2;
  const flip = p.dir === -1;

  ctx.save();
  ctx.translate(cx, cy);
  if(flip) ctx.scale(-1,1);

  // Body (pixel art style)
  const bodyBob = p.onGround ? Math.sin(p.animT*0.2)*2 : 0;

  // Cape/aura
  ctx.fillStyle = 'rgba(0,255,200,0.15)';
  ctx.beginPath();
  ctx.ellipse(0, 4+bodyBob, 22, 28, 0, 0, Math.PI*2);
  ctx.fill();

  // Legs
  const legAnim = p.onGround ? Math.sin(p.animT * 0.25) * 8 : 0;
  ctx.fillStyle = '#2244aa';
  ctx.fillRect(-12, 10+bodyBob, 10, 16); // left leg
  ctx.fillRect(2, 10+bodyBob, 10, 16);   // right leg
  // Leg animation
  if (Math.abs(p.vx) > 0.5) {
    ctx.fillStyle = '#3355cc';
    ctx.fillRect(-12, 10+bodyBob+legAnim, 10, 14);
    ctx.fillRect(2, 10+bodyBob-legAnim, 10, 14);
  }

  // Body
  ctx.fillStyle = '#cc3322';
  ctx.fillRect(-14, -8+bodyBob, 28, 20);

  // Belt
  ctx.fillStyle = '#ffcc00';
  ctx.fillRect(-14, 6+bodyBob, 28, 4);

  // Arms
  ctx.fillStyle = '#cc3322';
  ctx.fillRect(-22, -6+bodyBob, 10, 14);
  ctx.fillRect(12, -6+bodyBob, 10, 14);

  // Hands
  ctx.fillStyle = '#ffccaa';
  ctx.beginPath(); ctx.arc(-17, 8+bodyBob, 5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(17, 8+bodyBob, 5, 0, Math.PI*2); ctx.fill();

  // Head
  ctx.fillStyle = '#ffccaa';
  ctx.fillRect(-13, -28+bodyBob, 26, 22);

  // Hair / hat
  ctx.fillStyle = '#4422aa';
  ctx.fillRect(-15, -30+bodyBob, 30, 8);
  ctx.fillRect(-13, -38+bodyBob, 26, 12);

  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(-7, -22+bodyBob, 5, 5);
  ctx.fillRect(2, -22+bodyBob, 5, 5);

  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.fillRect(-6, -22+bodyBob, 2, 2);
  ctx.fillRect(3, -22+bodyBob, 2, 2);

  // Math symbol on chest
  ctx.fillStyle = '#ffcc00';
  ctx.font = 'bold 11px Orbitron';
  ctx.textAlign = 'center';
  ctx.fillText('∫', 0, 1+bodyBob);

  ctx.restore();
}

function drawEnemy(en) {
  if (!en.alive && en.deathTimer > 30) return;
  const floatY = en.y + Math.sin(en.bob) * 5;
  const alpha = en.alive ? 1 : Math.max(0, 1 - en.deathTimer/30);
  ctx.globalAlpha = alpha;

  const cx = en.x + en.w/2;
  const cy = floatY + en.h/2;

  // Glow
  ctx.shadowColor = en.correct ? '#00ffcc' : '#ff6b35';
  ctx.shadowBlur = 15;

  // Enemy body (spiky monster)
  ctx.fillStyle = en.correct ? '#00aa77' : '#aa3300';
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI*2);
  ctx.fill();

  // Spikes
  ctx.fillStyle = en.correct ? '#00ffcc' : '#ff6b35';
  for (let i=0;i<6;i++) {
    const angle = (i/6)*Math.PI*2 + en.bob*0.5;
    const sx = cx + Math.cos(angle)*28;
    const sy = cy + Math.sin(angle)*28;
    const ex1 = cx + Math.cos(angle-0.3)*20;
    const ey1 = cy + Math.sin(angle-0.3)*20;
    const ex2 = cx + Math.cos(angle+0.3)*20;
    const ey2 = cy + Math.sin(angle+0.3)*20;
    const tipX = cx + Math.cos(angle)*42;
    const tipY = cy + Math.sin(angle)*42;
    ctx.beginPath();
    ctx.moveTo(ex1,ey1); ctx.lineTo(tipX,tipY); ctx.lineTo(ex2,ey2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;

  // Eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx-9, cy-8, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+9, cy-8, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(cx-9, cy-8, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+9, cy-8, 4, 0, Math.PI*2); ctx.fill();

  // Answer label
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px Orbitron';
  ctx.textAlign = 'center';
  ctx.shadowColor = en.correct ? '#00ffcc' : '#ff6b35';
  ctx.shadowBlur = 8;
  ctx.fillText(en.label, cx, cy + 14);
  ctx.shadowBlur = 0;

  ctx.globalAlpha = 1;
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / 60;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}

// ─── Loop ─────────────────────────────────────────────────
function loop() {
  if (!gameRunning) return;
  ctx.clearRect(0, 0, W, H);
  update();
  drawBackground();
  drawParticles();
  enemies.forEach(drawEnemy);
  drawPlayer();
  requestAnimationFrame(loop);
}
</script>
