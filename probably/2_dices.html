<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Två tärningar</title>

    <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body class="two-dices-page">

    <main class="simulation">

        <h1>Två tärningar</h1>

        <p class="instruction">
            Ange antal kast och tryck ENTER
        </p>

        <div class="dice-area">

            <img
                id="dice_1"
                class="dice"
                src="img/dice_1.png"
                alt="Tärning 1"
            >

            <img
                id="dice_2"
                class="dice"
                src="img/dice_1.png"
                alt="Tärning 2"
            >

        </div>

        <div id="input_wrapper">

            <input
                id="input_box_one_dice"
                type="text"
                inputmode="numeric"
                value="Antal slag + ENTER"
                autocomplete="off"
            >

        </div>

        <div class="counters_wrapper">

            <div class="total-rolls">
                Antal kast totalt:
                <span id="counterRolls">0</span>
            </div>

            <div class="probabilities">

                <div class="probability-row">

                    <span class="probability-label">
                        P(summan är 11)
                    </span>

                    <span class="probability-value">
                        <span id="counterSum11">0.000</span> %
                    </span>

                </div>

                <div class="probability-row">

                    <span class="probability-label">
                        P(produkten ≥ 12)
                    </span>

                    <span class="probability-value">
                        <span id="counterProduct12">0.000</span> %
                    </span>

                </div>

                <div class="probability-row">

                    <span class="probability-label">
                        P(en &gt; 3, den andra &lt; 5)
                    </span>

                    <span class="probability-value">
                        <span id="counterMixed">0.000</span> %
                    </span>

                </div>

            </div>

        </div>

    </main>

    <script src="js/app_2_dices.js?v=4"></script>

</body>

</html>
